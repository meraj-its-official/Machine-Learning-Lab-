[project]
name = "trail-set"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MD MERAJ ALAM", email = "311682393+meraj-its-official@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "mlxtend>=0.25.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
trail-set = "trail_set:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
